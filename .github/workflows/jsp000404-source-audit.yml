name: JSP-000404 genuine-angle Lean audit

on:
  push:
    branches:
      - research/jsp000404-sendov-audit
    paths:
      - 'research/JSP000404/**'
      - '.github/workflows/jsp000404-source-audit.yml'
  pull_request:
    paths:
      - 'research/JSP000404/**'
      - '.github/workflows/jsp000404-source-audit.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
      - name: Check the exact Lean file and report axioms
        run: lake env lean research/JSP000404/SourceAudit.lean
      - name: Check exact rational boundary regressions
        run: python3 research/JSP000404/check_source.py
